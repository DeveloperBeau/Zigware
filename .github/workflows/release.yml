name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify the tag builds
        run: zig build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Consume by url and hash: add the tag tarball URL to your build.zig.zon and run zig fetch --save=zigware. See [docs/publishing.md](https://github.com/DeveloperBeau/zigware/blob/main/docs/publishing.md)."

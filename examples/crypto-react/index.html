<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Crypto Demo (React)</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
      .app { max-width: 40rem; margin: 3rem auto; padding: 0 1.5rem; }
      .hint { color: #888; line-height: 1.5; }
      .form { display: flex; flex-direction: column; gap: 0.5rem; }
      .label { font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; }
      .field { padding: 0.5rem 0.75rem; font-size: 1rem; }
      .btn { margin-top: 1rem; padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; align-self: flex-start; }
      .out { margin-top: 1.5rem; padding: 1rem; background: rgba(127,127,127,0.12); border-radius: 0.4rem; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
      .err { margin-top: 1rem; color: #c0392b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The Zigware bridge shim (served by the runtime asset table) must load
         before the app bundle so window.Zigware exists when React mounts. -->
    <script src="/zigware.js"></script>
    <script type="module" src="/frontend/main.jsx"></script>
  </body>
</html>
